name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]

    services:
      dakera:
        image: ghcr.io/dakera-ai/dakera:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          DAKERA_AUTH_ENABLED: "false"
          DAKERA_HOST: "0.0.0.0"
          DAKERA_PORT: "3300"
        ports:
          - 3300:3300
        options: >-
          --health-cmd "curl -f http://localhost:3300/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Dakera
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3300/health; then
              echo "Dakera is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Dakera failed to start"
          exit 1

      - name: Run integration tests
        env:
          DAKERA_API_URL: http://localhost:3300
        run: npm test
